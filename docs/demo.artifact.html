<title>Nodemap Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. A slim header with example tabs, the canvas fills the rest, panels slide over it (bottom sheet on phones, side panel on wide screens). */
:root {
  --paper: #eef0ea; --surface: #fbfcf8; --surface-2: #f2f4ee; --ink: #1b1f1a; --muted: #646c60; --line: #d5d9cd;
  --accent: #3b5bdb; --accent-ink: #ffffff; --ok: #2b8a3e; --bad: #c92a2a; --dot: #c6cbbd;
  --f-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #131511; --surface: #1b1e19; --surface-2: #23271f; --ink: #e6e9e1; --muted: #9aa294; --line: #31362d;
  --accent: #8198f7; --accent-ink: #10131a; --ok: #69db7c; --bad: #ff8787; --dot: #2a2e26; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #131511; --surface: #1b1e19; --surface-2: #23271f; --ink: #e6e9e1; --muted: #9aa294; --line: #31362d;
  --accent: #8198f7; --accent-ink: #10131a; --ok: #69db7c; --bad: #ff8787; --dot: #2a2e26; color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--surface); color: var(--ink); font-family: var(--f-ui); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; position: relative; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-right: auto; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand small { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.gtype { font-weight: 600; font-size: 14px; letter-spacing: 0; margin-left: 4px; height: 34px; }
.app[data-mode="integration"] .gtype { opacity: .5; }
.actions { display: flex; gap: 6px; }
.btn { appearance: none; font: inherit; font-weight: 500; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 9px; height: 38px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn .glyph { font-family: var(--f-mono); font-size: 13px; }

#tabs { order: 3; flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
#tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; font: inherit; font-weight: 500; color: var(--muted); padding: 10px 10px 11px; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (min-width: 760px) { #tabs { order: 0; flex-basis: auto; margin: 0 auto 0 12px; } .brand { margin-right: 0; } .bar { padding-block: 0; } .bar > * { align-self: stretch; display: flex; align-items: center; } .tab { padding-block: 16px 14px; } }

.sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; }
#blurb { margin: 0; color: var(--muted); flex: 1; min-width: 0; line-height: 1.35; }
#status { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
#status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
#status[data-state="ok"]::before { background: var(--ok); }
#status[data-state="error"] { color: var(--bad); }
#status[data-state="error"]::before { background: var(--bad); }
#status[data-state="running"]::before { background: var(--accent); }
#reset { height: 32px; font-size: 13px; padding: 0 10px; }
.controls { display: flex; align-items: center; gap: 6px; }
.pick { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; height: 32px; padding: 0 6px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: flex; gap: 8px; align-items: baseline; line-height: 1.4; }
.checks li::before { content: "✓"; color: var(--ok); font-weight: 700; flex: none; }
.checks li[data-level="error"]::before { content: "✕"; color: var(--bad); }
.checks li[data-level="warning"]::before { content: "!"; color: #e67700; }
.sig { font-family: var(--f-mono); font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
#panel-body > *, .call > * { flex: none; }
/* The panel itself scrolls (with its header pinned): one scroller, reliable on iOS Safari. */
#panel { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
#panel > .panel-head { position: sticky; top: 0; z-index: 1; background: var(--surface); }
#panel > #panel-body { overflow: visible; }
@media (max-width: 899px) { #panel { display: block; } }
.field .req, .field .opt { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.field textarea { font: inherit; font-weight: 400; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; resize: vertical; }
.field input { font: inherit; font-weight: 400; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.lib { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lib li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.lib li span { flex: 1; min-width: 0; }
.lib li small { color: var(--muted); font-family: var(--f-mono); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib li .btn { height: 32px; font-size: 13px; }
h3.sub-h { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 6px 0 0; }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 700px) { #blurb { flex-basis: 100%; } .controls { width: 100%; } #status { margin-right: auto; } }
@media (max-width: 700px) { .controls { flex-wrap: wrap; } .controls .pick { flex: 1 1 0; min-width: 0; } #status { flex-basis: 100%; white-space: normal; } }
@media (max-width: 400px) { #status { display: none; } }
.app[data-mode="integration"] .controls { display: none; }
.tab-divider { width: 1px; background: var(--line); margin: 10px 6px; flex: none; }
.tab-integ { font-family: var(--f-mono); font-size: 13px; }

#alt { flex: 1; min-height: 0; overflow-y: auto; background: var(--paper); }
.integ { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "side" "map" "code"; min-height: 100%; }
.integ-side { grid-area: side; } .integ-map { grid-area: map; } .integ-code { grid-area: code; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-top: 1px solid var(--line); min-width: 0; }
.integ-side { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.integ-map { height: 62vh; min-height: 340px; position: relative; }
.integ-map node-map { height: 100%; --nm-bg: var(--paper); --nm-dot: var(--dot); --nm-node: var(--surface); --nm-node-2: var(--surface-2); --nm-border: var(--line); --nm-text: var(--ink); --nm-muted: var(--muted); --nm-accent: var(--accent); --nm-font: var(--f-ui); --nm-mono: var(--f-mono); }
.integ-map > .nm-root { --nm-bg: var(--paper); --nm-dot: var(--dot); --nm-node: var(--surface); --nm-node-2: var(--surface-2); --nm-border: var(--line); --nm-text: var(--ink); --nm-muted: var(--muted); --nm-accent: var(--accent); --nm-font: var(--f-ui); --nm-mono: var(--f-mono); }
@media (min-width: 900px) { #alt { overflow: hidden; } .integ { grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "side map" "code map"; height: 100%; }
  .integ-side, .integ-code { border-right: 1px solid var(--line); } .integ-side { border-bottom: 0; } .integ-code { border-top: 0; padding-top: 0; overflow-y: auto; } .integ-map { height: auto; min-height: 0; } }
.integ-side { padding-bottom: 16px; }
.slider { display: flex; justify-content: space-between; font-weight: 600; }
.slider output { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
#rx-f { width: 100%; accent-color: var(--accent); height: 32px; }
.readout { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.readout .big { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.readout[data-busy="true"] .big { opacity: .6; }
.chip { font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
code { font-family: var(--f-mono); font-size: .92em; }
.log-title { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 4px 0 0; }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-family: var(--f-mono); font-size: 12px; }
.log li { display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); min-width: 0; }
.log b { color: var(--accent); font-weight: 500; flex: none; }
.log li:only-child span { color: var(--muted); }
.log span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gauge { display: block; width: 100%; height: auto; }
.gauge-track { fill: none; stroke: var(--line); stroke-width: 9; stroke-linecap: round; }
.gauge-fill { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; }
.gauge-value { font-family: var(--f-mono); font-size: 15px; fill: var(--ink); }
.gauge-tick { font-family: var(--f-mono); font-size: 8px; fill: var(--muted); }

#canvas { flex: 1; min-height: 0; outline: none; }
/* Without a library theme the canvas borrows the page's palette. */
#canvas:not([data-nm-theme]) {
  --nm-bg: var(--paper); --nm-dot: var(--dot); --nm-node: var(--surface); --nm-node-2: var(--surface-2); --nm-border: var(--line);
  --nm-text: var(--ink); --nm-muted: var(--muted); --nm-accent: var(--accent); --nm-font: var(--f-ui); --nm-mono: var(--f-mono); }
#canvas .nm-toolbar { bottom: 12px; }
#canvas .nm-toast { bottom: 84px; }

#panel { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; max-height: 88%; display: flex; flex-direction: column;
  background: var(--surface); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px rgb(0 0 0 / .18); }
@media (min-width: 900px) { .app.panel-open { padding-right: 400px; } #panel { left: auto; top: 0; width: 400px; max-height: none; border-radius: 0; border-top: 0; border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgb(0 0 0 / .12); } }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 8px max(16px, env(safe-area-inset-left, 0px)); }
.panel-head h2 { font-size: 15px; margin: 0; text-wrap: balance; }
#panel-close { width: 38px; justify-content: center; padding: 0; font-size: 18px; }
#panel-body { overflow-y: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.note { color: var(--muted); margin: 0; line-height: 1.45; font-size: 13px; }
.code { font-family: var(--f-mono); font-size: 12px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; margin: 0; overflow-x: auto; white-space: pre; color: var(--ink); }
.call { display: flex; flex-direction: column; gap: 12px; }
.args { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.arg { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
.arg small { font-family: var(--f-mono); font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 11px; }
.arg input, #json-text { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
.arg input:focus-visible, #json-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.results { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.res-head { display: flex; justify-content: space-between; padding: 6px 12px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.res { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); }
.res output { font-family: var(--f-mono); font-size: 13px; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.res.err { color: var(--bad); }
#json-text { font-family: var(--f-mono); font-size: 12.5px; min-height: 220px; flex: 1; resize: vertical; line-height: 1.5; }
@media (pointer: coarse) { #json-text { font-size: 16px; } }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.help { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; line-height: 1.45; }
.help b { font-weight: 600; }
kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface-2); }
@media (max-width: 420px) { .btn .label { display: none; } .btn { padding: 0 10px; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="3" width="10" height="8" rx="2.5" fill="none" stroke="var(--ink)" stroke-width="1.8"/><rect x="15" y="15" width="10" height="8" rx="2.5" fill="none" stroke="var(--ink)" stroke-width="1.8"/><path d="M11 7c6 0 0 12 4 12" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="7" r="2.2" fill="var(--accent)"/><circle cx="15" cy="19" r="2.2" fill="var(--accent)"/></svg>
      <span>Nodemap</span>
      <select id="gtype" class="pick gtype" aria-label="Graph type"></select>
    </div>
    <nav id="tabs" role="tablist" aria-label="Examples"></nav>
    <div class="actions">
      <button type="button" class="btn" data-panel="build" aria-pressed="false" hidden><span class="glyph">λ</span><span class="label">Build</span></button>
      <button type="button" class="btn" data-panel="call" aria-pressed="false"><span class="glyph">ƒ(x)</span><span class="label">Call</span></button>
      <button type="button" class="btn" data-panel="json" aria-pressed="false"><span class="glyph">{ }</span><span class="label">JSON</span></button>
      <button type="button" class="btn" data-panel="help" aria-pressed="false" aria-label="How to use it"><span class="glyph">?</span></button>
    </div>
  </header>
  <div class="sub">
    <p id="blurb"></p>
    <div class="controls">
      <span id="status" role="status">ready</span>
      <select id="wires" class="pick" aria-label="Wire style"><option value="smart">Routed wires</option><option value="curved">Curved wires</option></select>
      <select id="theme" class="pick" aria-label="Theme"></select>
      <select id="engine" class="pick" aria-label="Layout engine"><option value="layered">Built-in layout</option><option value="elk">ELK layout</option></select>
      <button type="button" class="btn" id="reset">Reset</button>
    </div>
  </div>
  <main id="canvas" aria-label="Node map canvas"></main>
  <div id="alt" hidden></div>
  <aside id="panel" hidden aria-labelledby="panel-title">
    <div class="panel-head"><h2 id="panel-title"></h2><button type="button" class="btn" id="panel-close" aria-label="Close panel">×</button></div>
    <div id="panel-body"></div>
  </aside>
